name: Deploy to Vercel

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check Vercel token configuration
        id: check-token
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::error::VERCEL_TOKEN secret is not configured"
            echo "missing=true" >> $GITHUB_OUTPUT
          else
            echo "VERCEL_TOKEN is configured"
            echo "missing=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Vercel Preview
        if: github.event_name == 'pull_request' && steps.check-token.outputs.missing != 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod=false'

      - name: Explain missing token on PR
        if: github.event_name == 'pull_request' && steps.check-token.outputs.missing == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.issue.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `## ⚠️ Vercel Deployment Not Configured

The Vercel deployment workflow cannot run because the **VERCEL_TOKEN** secret is missing.

**To enable Vercel preview deployments:**
1. Go to **Settings → Secrets and variables → Actions** in your GitHub repository
2. Click **New repository secret** and add `VERCEL_TOKEN`
3. Also add `VERCEL_ORG_ID` and `VERCEL_PROJECT_ID` if you want production deployments
4. The workflow will then automatically deploy preview URLs on pull requests

*For testing Vercel serverless functions, the deployment URL will appear as a comment on approved PRs once configured.*

---

*If you've already added the secrets, please wait a moment for them to propagate, or contact your repository administrator.*