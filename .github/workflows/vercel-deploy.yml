name: Vercel Preview Deploy

on:
  workflow_run:
    workflows: ['Vercel Preview Build']
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  deploy-preview:
    name: Deploy Preview to Vercel
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'preview' || true)
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.preview-url }}
    steps:
      - name: Download Vercel Prebuilt Output
        uses: actions/download-artifact@v4
        with:
          name: vercel-preview-output-${{ github.event.workflow_run.pull_request_number }}
          path: .vercel/output

      - name: Verify Artifact Contains PR Number Metadata
        run: |
          if [ ! -f ".vercel/output/pr-number.json" ]; then
            echo "::error::No pr-number.json found in artifact"
            exit 1
          fi
          PR_NUMBER=$(cat .vercel/output/pr-number.json | python3 -c "import sys,json; print(json.load(sys.stdin)['prNumber'])")
          if [ -z "$PR_NUMBER" ]; then
            echo "::error::prNumber not found in metadata"
            exit 1
          fi
          echo "PR Number from metadata: $PR_NUMBER"

      - name: Check for preview label (maintainer approval)
        run: |
          PR_NUMBER=${{ github.event.workflow_run.pull_request_number }}
          LABELS=$(gh pr view $PR_NUMBER --json labels --jq '.labels[].name' || true)
          if echo "$LABELS" | grep -q "preview"; then
            echo "preview label present - proceeding with deployment"
          else
            echo "::notice::No preview label found - skipping deployment (add 'preview' label to approve)"
            exit 0
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel Preview
        id: deploy
        run: |
          PREVIEW_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "preview-url=$PREVIEW_URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $PREVIEW_URL"

      - name: Comment PR with Preview URL
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const previewUrl = '${{ steps.deploy.outputs.preview-url }}';
            const prNumber = ${{ github.event.workflow_run.pull_request_number }};
            const comment = `## Preview Deployment Ready

Your preview deployment is ready!

**Preview URL:** ${previewUrl}

**Environment:** Preview
**Commit:** \${{ github.event.workflow_run.head_sha || context.sha || 'unknown' }.substring(0, 7) }
**Branch:** \${{ github.event.workflow_run.head_ref || github.head_ref || 'unknown' }}

---

*Deployed by Vercel via GitHub Actions (maintainer approved)*`;

            // Find existing comment from this workflow to update
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });

            const existingComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Deployed by Vercel via GitHub Actions')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: comment
              });
            }