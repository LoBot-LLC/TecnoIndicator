name: Vercel Preview Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to build'
        required: true

env:
  NODE_VERSION: '22'

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

jobs:
  build-preview:
    name: Build Preview
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      pr-number: ${{ steps.pr-number.outputs.value }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', github.event.inputs.pr_number) || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck --if-present

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present

      - name: Build production bundle
        run: npm run build

      - name: Extract PR number
        if: github.event_name == 'pull_request'
        id: pr-number
        run: |
          echo "value=${{ github.event.number }}" >> $GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ github.event.number || github.event.inputs.pr_number }}
          path: .vercel/output
          if-no-files-found: ignore
          retention-days: 7

      - name: Comment on PR (same-repo only)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Only comment on same-repository PRs to avoid fork issues
            if (context.repo.repo === context.payload?.pull_request?.head?.repo?.full_name || context.repo.repo === '${{ github.repository }}') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `## 📋 Vercel Preview Build

A Vercel preview deployment has been built for this PR.

To deploy to Vercel, add the **preview** label to this pull request, or use the manual deployment trigger.

**Commit:** \${{ github.sha.substring(0, 7) }}
**Branch:** \${{ github.head_ref }}
              `});
            }